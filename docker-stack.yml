# ──────────────────────────────────────────────────────────────────────────────
#  PostHog — Docker Swarm stack
#
#  Deploy:    docker stack deploy -c docker-stack.yml --with-registry-auth posthog
#  Status:    docker stack services posthog
#  Logs:      docker service logs -f posthog_<service>
#
#  Placement is enforced via node labels:
#    BM1 → posthog.role=data
#    BM2 → posthog.role=app
# ──────────────────────────────────────────────────────────────────────────────
version: "3.9"

x-posthog-app: &posthog-app
  image: posthog/posthog:${POSTHOG_IMAGE_TAG:-latest}
  environment: &posthog-env
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_USER: ${CLICKHOUSE_USER}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE}
    CLICKHOUSE_SECURE: "false"
    CLICKHOUSE_VERIFY: "false"
    KAFKA_HOSTS: kafka:9092
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/
    SECRET_KEY: ${SECRET_KEY}
    ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS}
    SITE_URL: ${SITE_URL}
    DISABLE_SECURE_SSL_REDIRECT: ${DISABLE_SECURE_SSL_REDIRECT:-0}
    IS_BEHIND_PROXY: ${IS_BEHIND_PROXY:-1}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-10.0.0.0/8}
    DEPLOYMENT: ${DEPLOYMENT:-baremetal-swarm}
    DEBUG: ${DEBUG:-0}
    SENTRY_DSN: ${SENTRY_DSN:-}
    OBJECT_STORAGE_ENABLED: "true"
    OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
    OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
    OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
    OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
    OBJECT_STORAGE_SESSION_RECORDING_FOLDER: session_recordings
  depends_on:
    - postgres
    - redis
    - clickhouse
    - kafka

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ════════════════════════════════════════════════════════════════════════════
  #  DATA PLANE  — pinned to BM1 (posthog.role=data)
  # ════════════════════════════════════════════════════════════════════════════

  zookeeper:
    image: confluentinc/cp-zookeeper:${ZOOKEEPER_IMAGE_TAG:-7.7.0}
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 1
    volumes:
      - /opt/posthog/data/zookeeper/data:/var/lib/zookeeper/data
      - /opt/posthog/data/zookeeper/log:/var/lib/zookeeper/log
    networks: [posthog_net]
    logging: *default-logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.posthog.role == data]
      resources:
        limits: { cpus: "1.0", memory: 1G }
        reservations: { cpus: "0.25", memory: 512M }
      restart_policy: { condition: any, delay: 5s }

  kafka:
    image: confluentinc/cp-kafka:${KAFKA_IMAGE_TAG:-7.7.0}
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 10737418240   # 10 GiB per partition cap
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx4G -Xms2G}
    volumes:
      - /opt/posthog/data/kafka:/var/lib/kafka/data
    networks: [posthog_net]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.posthog.role == data]
      resources:
        limits: { cpus: "4.0", memory: 6G }
        reservations: { cpus: "1.0", memory: 3G }
      restart_policy: { condition: any, delay: 10s }

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_IMAGE_TAG:-24.8-alpine}
    depends_on: [zookeeper, kafka]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - /opt/posthog/data/clickhouse:/var/lib/clickhouse
      - /opt/posthog/data/clickhouse-logs:/var/log/clickhouse-server
    configs:
      - source: clickhouse_config
        target: /etc/clickhouse-server/config.d/posthog.xml
      - source: clickhouse_users
        target: /etc/clickhouse-server/users.d/posthog.xml
    networks: [posthog_net]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.posthog.role == data]
      resources:
        limits: { cpus: "12.0", memory: 28G }
        reservations: { cpus: "4.0", memory: 16G }
      restart_policy: { condition: any, delay: 10s }

  objectstorage:
    image: minio/minio:${MINIO_IMAGE_TAG:-latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
      MINIO_BROWSER_REDIRECT_URL: ${SITE_URL}/minio/
    volumes:
      - /opt/posthog/data/minio:/data
    networks: [posthog_net]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.posthog.role == data]
      resources:
        limits: { cpus: "2.0", memory: 2G }
        reservations: { cpus: "0.25", memory: 512M }
      restart_policy: { condition: any, delay: 5s }

  # One-shot job that creates the PostHog bucket on first boot. It runs to
  # completion and exits — Swarm reports it as 'shutdown', which is expected.
  objectstorage-init:
    image: minio/mc:latest
    depends_on: [objectstorage]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until mc alias set local http://objectstorage:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing local/${OBJECT_STORAGE_BUCKET}
        mc anonymous set none local/${OBJECT_STORAGE_BUCKET}
        echo "minio bucket ready"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
    networks: [posthog_net]
    logging: *default-logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.posthog.role == data]
      restart_policy:
        condition: on-failure
        max_attempts: 3

  plugin-server:
    <<: *posthog-app
    command: ["./bin/plugin-server"]
    environment:
      <<: *posthog-env
      WORKER_CONCURRENCY: "8"
      PLUGIN_SERVER_MODE: "ingestion,async"
    networks: [posthog_net]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:6738/_health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.posthog.role == data]
      resources:
        limits: { cpus: "6.0", memory: 8G }
        reservations: { cpus: "1.0", memory: 4G }
      restart_policy: { condition: any, delay: 10s }
      update_config: { order: stop-first, parallelism: 1 }

  worker:
    <<: *posthog-app
    command: ["./bin/docker-worker-celery", "--with-scheduler"]
    networks: [posthog_net]
    logging: *default-logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.posthog.role == data]
      resources:
        limits: { cpus: "4.0", memory: 4G }
        reservations: { cpus: "0.5", memory: 2G }
      restart_policy: { condition: any, delay: 10s }
      update_config: { order: stop-first, parallelism: 1 }

  # ════════════════════════════════════════════════════════════════════════════
  #  APP PLANE  — pinned to BM2 (posthog.role=app)
  # ════════════════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-15.12-alpine}
    command: >
      postgres
        -c max_connections=300
        -c shared_buffers=2GB
        -c effective_cache_size=6GB
        -c work_mem=16MB
        -c maintenance_work_mem=512MB
        -c wal_buffers=16MB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /opt/posthog/data/postgres:/var/lib/postgresql/data
    networks: [posthog_net]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.posthog.role == app]
      resources:
        limits: { cpus: "4.0", memory: 8G }
        reservations: { cpus: "1.0", memory: 4G }
      restart_policy: { condition: any, delay: 10s }
      update_config: { order: stop-first, parallelism: 1 }

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7.2-alpine}
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 1500mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
    volumes:
      - /opt/posthog/data/redis:/data
    networks: [posthog_net]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.posthog.role == app]
      resources:
        limits: { cpus: "1.0", memory: 2G }
        reservations: { cpus: "0.25", memory: 512M }
      restart_policy: { condition: any, delay: 5s }

  # The web service handles BOTH the dashboard/API and event capture
  # endpoints (/e, /batch, /s, /capture). Caddy routes all of them to web.
  # Two replicas on BM2 provide hot-redundancy: rolling deploys are
  # zero-downtime, and a single-replica crash does not drop ingestion.
  web:
    <<: *posthog-app
    command: ["./bin/docker-server"]
    networks: [posthog_net]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8000/_health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      replicas: 2
      placement:
        constraints: [node.labels.posthog.role == app]
      resources:
        limits: { cpus: "3.0", memory: 6G }
        reservations: { cpus: "0.5", memory: 3G }
      restart_policy: { condition: any, delay: 10s }
      update_config: { order: start-first, parallelism: 1, delay: 30s }

  # One-shot job — runs migrations then exits. Re-runs on every `deploy.sh`.
  migrate:
    <<: *posthog-app
    command:
      - /bin/sh
      - -c
      - |
        ./bin/migrate &&
        python manage.py run_async_migrations &&
        echo "migrations complete"
    networks: [posthog_net]
    logging: *default-logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.posthog.role == app]
      restart_policy:
        condition: on-failure
        max_attempts: 3

  caddy:
    image: caddy:${CADDY_IMAGE_TAG:-2-alpine}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - /opt/posthog/data/caddy/data:/data
      - /opt/posthog/data/caddy/config:/config
    # HTTP-only — TLS is terminated by the Cloudflare tunnel on this host.
    # Only port 80 is bound, and only on localhost so nothing else on the LAN
    # or internet can hit Caddy directly; cloudflared connects via 127.0.0.1.
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    networks: [posthog_net]
    logging: *default-logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.posthog.role == app]
      resources:
        limits: { cpus: "1.0", memory: 256M }
        reservations: { cpus: "0.1", memory: 128M }
      restart_policy: { condition: any, delay: 5s }
      update_config: { order: stop-first, parallelism: 1 }

# ════════════════════════════════════════════════════════════════════════════════

networks:
  posthog_net:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"

configs:
  caddyfile:
    file: ./config/caddy/Caddyfile
  clickhouse_config:
    file: ./config/clickhouse/config.d/posthog.xml
  clickhouse_users:
    file: ./config/clickhouse/users.d/posthog.xml
